<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Paletas | Colorfly Studio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Colorfly Studio</h1>
        <p>Generador de Paletas Interactivo</p>
    </header>

    <main>
        <section class="controls">
            <div class="control-group">
                <label for="palette-size">Tamaño de paleta:</label>
                <select id="palette-size">
                    <option value="6">6 colores</option>
                    <option value="8">8 colores</option>
                    <option value="9">9 colores</option>
                </select>
            </div>

            <div class="control-group">
                <label for="color-format">Formato:</label>
                <select id="color-format">
                    <option value="HEX">HEX</option>
                    <option value="HSL">HSL</option>
                </select>
            </div>

            <button id="generate-btn">Generar paleta</button>
        </section>

        <!-- Aquí se inyectan las tarjetas desde JS -->
        <section id="palette-container" class="palette-container">
        </section>
    </main>

    <footer>
        <p>Proyecto Integrador M1 - Desarrollado por Ianiv Rojas</p>
    </footer>

    <!-- Toast de notificaciones -->
    <div id="toast" class="toast hidden">¡Paleta generada!</div>

    <script src="js/app.js"></script>
</body>
</html>
